name: Synchronize imported music
run-name: 'Sync music ${{ inputs.video_id }} / ${{ inputs.source_sha }}'
on:
  workflow_dispatch:
    inputs:
      video_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: music-publication
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      MUSIC_BUILD_TARGET: pages
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git restore --worktree -- node_modules
      - name: Ensure audio tools are available
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Prepare audio, title, catalog and waveform
        id: prepare
        env:
          IMPORT_VIDEO_ID: ${{ inputs.video_id }}
          IMPORT_SOURCE_SHA: ${{ inputs.source_sha }}
          MUSIC_FFMPEG: /usr/bin
        run: node scripts/prepare-import.mjs
      - run: npm test
      - name: Commit only the verified music files
        env:
          IMPORT_PATH: ${{ steps.prepare.outputs.path }}
          IMPORT_VIDEO_ID: ${{ inputs.video_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${IMPORT_PATH}" musicList.json waveforms.json imported-tracks.json
          git diff --cached --quiet || git commit -m "Synchronize imported music ${IMPORT_VIDEO_ID}"
          git pull --rebase origin master
          git push origin HEAD:master
      # GITHUB_TOKEN pushes do not start the normal push workflow. Publish here too.
      - run: npm run build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
      - name: Upload GitHub Pages library
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: synchronize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages library
        id: deployment
        uses: actions/deploy-pages@v4
