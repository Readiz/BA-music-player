name: Verify And Deploy Player

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write

concurrency:
  group: music-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUSIC_BUILD_TARGET: pages
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          ref: ${{ github.event_name == 'push' && 'master' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git restore --worktree -- node_modules
      - run: npm test
      - name: Upload unsigned Tizen launcher
        uses: actions/upload-artifact@v4
        with:
          name: readiz-music-tizen-unsigned
          path: |
            dist/app.wgt
            dist/app.wgt.sha256
          if-no-files-found: error
      # Preserve the old Pages player using the same allowlisted runtime output.
      - name: Preserve GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
      - name: Upload GitHub Pages library
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages library
        id: deployment
        uses: actions/deploy-pages@v4
