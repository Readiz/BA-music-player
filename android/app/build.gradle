plugins { id 'com.android.application' }
def signingDir = System.getenv('MUSIC_ANDROID_SIGNING_DIR') ?: "${System.properties['user.home']}/.config/readiz-music/android-signing"
def passwordFile = file("${signingDir}/password")
android {
    namespace 'com.readiz.music'
    compileSdk 36
    defaultConfig {
        applicationId 'com.readiz.music'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '0.3.1'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file("${signingDir}/release.jks")
            storePassword passwordFile.exists() ? passwordFile.text.trim() : ''
            keyAlias 'readiz-music'
            keyPassword storePassword
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-session:1.11.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
