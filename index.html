<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="CodeHim">
    <title>Readiz's Player</title>
    
    <!-- Style CSS -->
    <link rel="stylesheet" href="css/style.css?v=20261004-albums">
	<!-- Demo CSS (No need to include it into your project) -->
	<link rel="stylesheet" href="css/demo.css">
  
  </head>
  <body>
<div>
  <div id="loading-overlay" style="color: #f3f3f3;
    position: absolute;
    top: 0;
    bottom: 0px;
    width: 100%;
    text-align: center;
    background-color: black;
    z-index: 9999;
">
    <div style="display: grid; height: 100%; text-align: center; vertical-align: middle;">
        <h1 style="display: flex; flex-direction: column; place-content: flex-end;">Readiz's Player</h1>
        <p>Click here to use</p>
    </div>
</div>
 <div class="simple-audio-player" id="simp" data-config='{"shide_top":false,"shide_btm":false,"auto_load":true}'>
  <aside class="simp-albums" id="album-panel" aria-labelledby="album-heading">
    <div class="album-heading-row">
      <div><p class="library-eyebrow">MY LIBRARY</p><h2 id="album-heading">앨범</h2></div>
      <button type="button" class="album-close" aria-label="앨범 패널 닫기">닫기</button>
    </div>
    <p class="album-selection-summary" role="status"></p>
    <div class="album-actions">
      <button type="button" class="albums-select-all">전체 선택</button>
      <button type="button" class="albums-clear">전체 해제</button>
    </div>
    <div class="album-grid" role="group" aria-label="재생할 앨범"></div>
    <p class="album-hint">앨범을 여러 개 골라 함께 들어보세요.</p>
    <button type="button" class="album-done">선택 완료</button>
  </aside>
  <button type="button" class="album-backdrop" aria-label="앨범 패널 닫기" tabindex="-1"></button>
  <section class="simp-main" aria-label="음악 플레이어">
    <div class="album-mobile-bar">
      <button type="button" class="album-open" aria-controls="album-panel" aria-expanded="false">앨범 선택</button>
      <span class="album-mobile-summary"></span>
    </div>
    <div class="simp-queue-heading"><h2>재생 목록</h2><span class="queue-count"></span></div>
    <div class="simp-playlist">
      <p class="simp-empty" hidden>들을 앨범을 선택해 주세요.</p>
      <ul id="ulist" aria-label="선택한 앨범의 곡"></ul>
    </div>
  </section>
  <div class="simp-footer">Song copyrights belong to its owner. · 곡명 참고: <a href="https://ba.cnfast.top/en/track/ost/" target="_blank" rel="noopener noreferrer">BA OST Index</a> · <a href="https://bluearchive.fandom.com/wiki/Soundtrack" target="_blank" rel="noopener noreferrer">BA Wiki</a></div>
</div>
</div>

<!-- Audio Player JS -->
<script src="./js/script.js?v=20261004-albums"></script>
<script type="module">
  async function getMusics() {
      const [arr, catalog] = await Promise.all([
          fetch('./musicList.json', { cache: 'no-cache' }).then(res => {
              if (!res.ok) throw new Error('음악 목록을 불러오지 못했습니다.');
              return res.json();
          }),
          // Keep the filename-based playlist usable if metadata is unavailable.
          fetch('./blue-archive-ost.json', { cache: 'no-cache' })
              .then(res => res.ok ? res.json() : { titles: {} })
              .catch(() => ({ titles: {} })),
      ]);
      const list = document.createDocumentFragment();
      for (const [index, item] of arr.entries()) {
          const parts = String(item).split('/');
          const artist = decodeURIComponent(parts[parts.length - 2]);
          let songname = decodeURIComponent(parts[parts.length - 1]).replace(/\.(ogg|mp3|m4a)$/i, '');
          const unnamed = artist === 'Blue Archive' && songname.match(/^theme_(\d+)$/);
          const title = unnamed && catalog.titles?.[Number(unnamed[1])];
          // Fill missing names by OST number without changing audio URLs or known names.
          if (title) songname += `-${title}`;

          const li = document.createElement('li');
          li.dataset.folder = parts.slice(2, -1).map(decodeURIComponent).join('/') || artist;
          if (index === 0) li.classList.add('simp-active');
          const source = document.createElement('span');
          source.className = 'simp-source';
          source.dataset.src = item;
          source.textContent = songname;
          const description = document.createElement('span');
          description.className = 'simp-desc';
          description.textContent = artist;
          li.append(source, description);
          list.append(li);
      }
      document.getElementById('ulist').replaceChildren(list);
  }
  (async() => {
      await getMusics();
      BAPlayer();
      document.getElementById('loading-overlay').addEventListener('click', function(event) {
        document.getElementById('loading-overlay').classList.add("hide-loading");
      });
  })().catch(error => {
      console.error(error);
      document.querySelector('#loading-overlay p').textContent = '음악 목록을 불러오지 못했습니다. 새로고침해 주세요.';
  });
</script>
  </body>
</html>
