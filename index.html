<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="author" content="CodeHim">
    <title>Readiz Music</title>
    <meta name="description" content="작업하며 듣는 음악. 앨범을 골라 편하게 이어 들으세요.">
    <meta name="theme-color" content="#17212b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="./js/tv-mode.js"></script>
    <link rel="canonical" href="https://music.readiz.com/">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/music.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./assets/vendor/font-awesome/font-awesome.min.css">
    
    <!-- Style CSS -->
    <link rel="stylesheet" href="css/style.css?v=20261004-mobile">
	<!-- Demo CSS (No need to include it into your project) -->
	<link rel="stylesheet" href="css/demo.css">
    <link rel="stylesheet" href="./css/tv.css">
  
  </head>
  <body>
<header class="app-header"><a class="app-brand" href="./"><img src="./assets/icons/music.svg" width="28" height="28" alt="">Readiz Music</a><button class="app-install" type="button" hidden>앱 설치</button></header>
<div>
 <div class="simple-audio-player" id="simp" data-config='{"shide_top":false,"shide_btm":false,"auto_load":true}'>
  <div class="album-heading-row">
    <h2 id="album-heading">앨범</h2>
    <button type="button" class="album-toggle" aria-label="앨범 접기" title="앨범 접기" aria-controls="album-panel" aria-expanded="true"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="album-selection-summary" role="status"></span>
  </div>
  <aside class="simp-albums" id="album-panel" aria-labelledby="album-heading">
    <div class="album-actions">
      <button type="button" class="albums-select-all" disabled>전체 선택</button>
      <button type="button" class="albums-clear" disabled>전체 해제</button>
    </div>
    <div class="album-grid" role="group" aria-label="재생할 앨범"></div>
    <p class="album-hint">앨범을 여러 개 골라 함께 들어보세요.</p>
  </aside>
  <section class="simp-main" aria-label="음악 플레이어">
    <div class="library-load-state">
      <p role="status">음악 목록을 불러오는 중…</p>
      <button type="button" class="library-retry" hidden>다시 불러오기</button>
    </div>
    <div class="simp-queue-heading"><h2>재생 목록</h2><span class="queue-count"></span></div>
    <div class="simp-playlist">
      <p class="simp-empty" hidden>들을 앨범을 선택해 주세요.</p>
      <ul id="ulist" aria-label="선택한 앨범의 곡"></ul>
    </div>
  </section>
  <div class="simp-footer">Song copyrights belong to its owner. · 곡명 참고: <a href="https://ba.cnfast.top/en/track/ost/" target="_blank" rel="noopener noreferrer">BA OST Index</a> · <a href="https://bluearchive.fandom.com/wiki/Soundtrack" target="_blank" rel="noopener noreferrer">BA Wiki</a></div>
</div>
</div>

<p class="remote-hint">방향키 이동 · 확인 선택 · 뒤로 종료</p>
<section class="tv-exit-dialog" role="dialog" aria-modal="true" aria-labelledby="exit-title" hidden>
  <div class="exit-card"><h2 id="exit-title">음악을 종료할까요?</h2>
    <p class="exit-message">재생을 멈추고 앱을 닫습니다.</p>
    <div><button type="button" class="exit-cancel">계속 듣기</button><button type="button" class="exit-confirm">종료</button></div>
  </div>
</section>
<!-- Audio Player JS -->
<script src="./js/native-player.js"></script>
<script src="./js/script.js?v=20261004-mobile"></script>
<script defer src="./js/library.js"></script>
<script defer src="./js/remote-core.js"></script>
<script defer src="./js/remote.js"></script>
<script defer src="./js/app.js"></script>
  </body>
</html>
